<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frasco de Monedas</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    .error-message {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 0.75rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      display: none;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-6">

  <!-- HEADER -->
  <div class="text-center space-y-2">
    <div class="w-14 h-14 mx-auto rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-3xl">
      🪙
    </div>
    <h1 class="text-2xl font-bold text-slate-800">Frasco de Monedas</h1>
    <p class="text-xs text-slate-500">Ahorrar también puede ser divertido</p>
  </div>

  <!-- LOGIN -->
  <div id="vista-login" class="space-y-4">
    <input id="input-usuario" placeholder="Usuario"
      class="w-full px-4 py-2 border rounded-xl text-center" />
    <input id="input-pin" type="password" placeholder="PIN"
      class="w-full px-4 py-2 border rounded-xl text-center text-xl tracking-widest" />
    <button id="btn-entrar" onclick="validarLogin()"
      class="w-full bg-emerald-600 text-white py-2 rounded-xl">
      Entrar ✅
    </button>
    <div id="error-login" class="error-message"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="vista-dashboard" class="hidden space-y-6">

    <!-- PERFIL -->
    <div class="flex justify-between items-center">
      <div>
        <h2 class="font-bold text-slate-700">
          Hola <span id="nombre-perfil" class="text-emerald-600"></span>
        </h2>
        <p class="text-xs text-slate-400">Tu frasco hoy</p>
      </div>
      <button onclick="cerrarSesion()" class="text-xs text-slate-500">Salir 🚪</button>
    </div>

    <!-- RESUMEN -->
    <div class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white rounded-2xl p-4 space-y-2">
      <div class="flex justify-between">
        <span>Total ahorrado</span>
        <span>💰</span>
      </div>
      <div class="text-3xl font-bold" id="total-dinero">$0.00</div>
      <div class="flex justify-between text-xs opacity-90">
        <span>Monedas:</span>
        <span id="total-monedas">0</span>
      </div>
    </div>

    <!-- METAS -->
    <div class="bg-slate-100 rounded-xl p-3 text-sm text-slate-700">
      <p id="mensaje-meta">🌱 Empieza a ahorrar</p>
    </div>

    <!-- ACCIÓN -->
    <div class="space-y-2">
      <select id="tipo-movimiento"
        class="w-full px-3 py-2 border rounded-xl">
        <option value="INGRESO">➕ Guardar monedas</option>
        <option value="RETIRO">➖ Sacar monedas</option>
      </select>

      <div class="grid grid-cols-2 gap-2">
        <select id="select-denominacion"
          class="px-3 py-2 border rounded-xl"></select>
        <input id="input-cantidad" type="number" min="1" value="1"
          class="px-3 py-2 border rounded-xl text-center font-bold" />
      </div>

      <button id="btn-guardar" onclick="registrarMovimiento()"
        class="w-full bg-emerald-600 text-white py-2 rounded-xl">
        Confirmar 💾
      </button>

      <div id="error-dashboard" class="error-message"></div>
    </div>

    <!-- HISTORIAL -->
    <div>
      <h3 class="text-xs font-bold text-slate-400 uppercase">Últimos movimientos</h3>
      <div id="lista-historial" class="text-sm text-slate-600"></div>
    </div>

  </div>
</div>

<script>
/* ===== TU JS ORIGINAL SE MANTIENE ===== */
/* Solo cambiamos el tipo dinámico */

function registrarMovimiento() {
  const tipo = document.getElementById("tipo-movimiento").value;
  const denom = document.getElementById("select-denominacion").value;
  const cant = parseInt(document.getElementById("input-cantidad").value);

  const payload = {
    action: "registrar_movimiento",
    usuario: usuarioSesion,
    pin: pinSesion,
    tipo: tipo,
    denominacion: parseFloat(denom),
    cantidad: cant
  };

  callAppsScript(payload)
    .then(data => {
      actualizarPantallaDatos(data);
      actualizarMeta(data.totalDinero);
      solicitarHistorial();
    });
}

function actualizarMeta(total) {
  const meta = document.getElementById("mensaje-meta");
  if (total >= 100) meta.innerText = "🏆 ¡Meta alcanzada!";
  else if (total >= 50) meta.innerText = "💪 Vas muy bien";
  else if (total >= 20) meta.innerText = "🌱 Buen comienzo";
  else meta.innerText = "🪙 Sigue ahorrando";
}
</script>

</body>
</html>
``
